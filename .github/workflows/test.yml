name: Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same branch or pull request
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: "./frontend"

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm i

      # Also type-checks the tests (`tsc -b`)
      - name: Build packages
        run: pnpm build

      - name: Run unit tests
        run: pnpm -r --if-present test --run

  e2e:
    name: E2E tests (nostalgic-diva)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./frontend/packages/nostalgic-diva"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm i

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Self-contained suite: only talks to a local Vite server
      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: ./frontend/packages/nostalgic-diva/test-results
          retention-days: 7
